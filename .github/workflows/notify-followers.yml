name: Notify followers

# Emails people who follow a town when a push changes that town's books.
on:
  push:
    paths: ['data/real/**']
  workflow_dispatch:
    inputs:
      base:
        description: 'Compare from this commit'
        default: 'HEAD~1'
      dry_run:
        description: 'Print the emails instead of sending them'
        type: boolean
        default: true

jobs:
  notify:
    # Only pushes to the default branch (the one the site is published from).
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Email followers of changed towns
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BASE: ${{ github.event_name == 'push' && github.event.before || inputs.base }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/notify-changes.mjs --base "$BASE" --head "$GITHUB_SHA" $DRY
